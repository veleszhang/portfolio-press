name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test compression and folder import
        run: ./test.sh
      - name: Build Mac app
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PortfolioPress-Mac
          path: dist/*.zip
